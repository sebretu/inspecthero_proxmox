<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle/square container -->
  <rect width="100" height="100" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
  <!-- Left rail -->
  <line x1="28" y1="12" x2="28" y2="88" stroke="#008000" stroke-width="8" stroke-linecap="square"/>
  <!-- Right rail -->
  <line x1="72" y1="12" x2="72" y2="88" stroke="#008000" stroke-width="8" stroke-linecap="square"/>
  <!-- Cross rungs -->
  <line x1="28" y1="18" x2="72" y2="18" stroke="#008000" stroke-width="7"/>
  <line x1="28" y1="36" x2="72" y2="36" stroke="#008000" stroke-width="7"/>
  <line x1="28" y1="54" x2="72" y2="54" stroke="#008000" stroke-width="7"/>
  <line x1="28" y1="72" x2="72" y2="72" stroke="#008000" stroke-width="7"/>
  <line x1="28" y1="88" x2="72" y2="88" stroke="#008000" stroke-width="7"/>
</svg>
