<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Green Circle with border -->
  <circle cx="50" cy="50" r="47" fill="#006633" stroke="#004d26" stroke-width="4"/>
  <!-- Top and Bottom White wedges (45-degree cross) -->
  <!-- Top wedge -->
  <path d="M 50 50 L 16.78 16.78 A 47 47 0 0 1 83.22 16.78 Z" fill="#ffffff"/>
  <!-- Bottom wedge -->
  <path d="M 50 50 L 83.22 83.22 A 47 47 0 0 1 16.78 83.22 Z" fill="#ffffff"/>
  <!-- Center intersection point / clean border -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#004d26" stroke-width="4"/>
</svg>
