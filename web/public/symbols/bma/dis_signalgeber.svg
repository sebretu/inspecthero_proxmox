<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 120" width="170" height="120">
  <!-- Detector square on the left -->
  <rect x="15" y="15" width="90" height="90" fill="none" stroke="#dc2626" stroke-width="2.8" />
  <!-- Step pulse in bottom-left -->
  <path d="M 25 85 H 38 V 65 H 52 V 85" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow 1 pointing down-right -->
  <line x1="38" y1="36" x2="68" y2="66" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 57 66 L 68 68 L 66 57" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow 2 pointing down-right -->
  <line x1="56" y1="36" x2="86" y2="66" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 75 66 L 86 68 L 84 57" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Horn / Siren attached to the right side -->
  <path d="M 105 45 L 155 20 V 100 L 105 75 Z" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linejoin="round" />
  <!-- Inner 'S' with thin line -->
  <text x="130" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="normal" fill="#dc2626" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
