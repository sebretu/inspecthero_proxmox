<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <style>
    .line { stroke: #0f172a; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashdot { stroke: #0f172a; stroke-width: 1.5; stroke-dasharray: 6, 2, 1, 2; fill: none; }
    .node { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
    .black-rect { fill: #0f172a; stroke: #0f172a; }
    .box { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
    .txt { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
  </style>

  <!-- Background White Card -->
  <rect x="2" y="2" width="196" height="236" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Outer Enclosure Dash-Dot Box -->
  <rect x="15" y="38" width="170" height="175" class="dashdot"/>

  <!-- Top Terminals: L1, L2, L3, N -->
  <!-- L1 -->
  <text x="40" y="25" class="txt">L1</text>
  <circle cx="40" cy="38" r="4" class="node"/>
  <line x1="40" y1="38" x2="40" y2="55" class="line"/>

  <!-- L2 -->
  <text x="80" y="25" class="txt">L2</text>
  <circle cx="80" cy="38" r="4" class="node"/>
  <line x1="80" y1="38" x2="80" y2="55" class="line"/>

  <!-- L3 -->
  <text x="120" y="25" class="txt">L3</text>
  <circle cx="120" cy="38" r="4" class="node"/>
  <line x1="120" y1="38" x2="120" y2="55" class="line"/>

  <!-- N -->
  <text x="160" y="25" class="txt">N</text>
  <circle cx="160" cy="38" r="4" class="node"/>
  <line x1="160" y1="38" x2="160" y2="55" class="line"/>

  <!-- 4 Module Dash-Dot Columns -->
  <!-- Module 1 Column (L1) -->
  <rect x="22" y="48" width="36" height="135" class="dashdot"/>
  <rect x="36" y="55" width="8" height="10" class="black-rect"/>
  <line x1="40" y1="65" x2="40" y2="78" class="line"/>
  <!-- Switch / Thermal Disconnect Box 1 -->
  <rect x="27" y="78" width="26" height="26" class="box"/>
  <path d="M 33 98 L 33 88 L 38 88 L 38 94 L 43 94 L 47 84" class="line"/>
  <line x1="40" y1="104" x2="40" y2="116" class="line"/>
  <!-- Varistor Box 1 -->
  <rect x="31" y="116" width="18" height="26" class="box"/>
  <line x1="28" y1="138" x2="52" y2="120" class="line"/>
  <line x1="52" y1="120" x2="52" y2="126" class="line"/>
  <line x1="40" y1="142" x2="40" y2="155" class="line"/>
  <rect x="36" y="155" width="8" height="10" class="black-rect"/>
  <line x1="40" y1="165" x2="40" y2="195" class="line"/>

  <!-- Module 2 Column (L2) -->
  <rect x="62" y="48" width="36" height="135" class="dashdot"/>
  <rect x="76" y="55" width="8" height="10" class="black-rect"/>
  <line x1="80" y1="65" x2="80" y2="78" class="line"/>
  <!-- Switch / Thermal Disconnect Box 2 -->
  <rect x="67" y="78" width="26" height="26" class="box"/>
  <path d="M 73 98 L 73 88 L 78 88 L 78 94 L 83 94 L 87 84" class="line"/>
  <line x1="80" y1="104" x2="80" y2="116" class="line"/>
  <!-- Varistor Box 2 -->
  <rect x="71" y="116" width="18" height="26" class="box"/>
  <line x1="68" y1="138" x2="92" y2="120" class="line"/>
  <line x1="92" y1="120" x2="92" y2="126" class="line"/>
  <line x1="80" y1="142" x2="80" y2="155" class="line"/>
  <rect x="76" y="155" width="8" height="10" class="black-rect"/>
  <line x1="80" y1="165" x2="80" y2="195" class="line"/>

  <!-- Module 3 Column (L3) -->
  <rect x="102" y="48" width="36" height="135" class="dashdot"/>
  <rect x="116" y="55" width="8" height="10" class="black-rect"/>
  <line x1="120" y1="65" x2="120" y2="78" class="line"/>
  <!-- Switch / Thermal Disconnect Box 3 -->
  <rect x="107" y="78" width="26" height="26" class="box"/>
  <path d="M 113 98 L 113 88 L 118 88 L 118 94 L 123 94 L 127 84" class="line"/>
  <line x1="120" y1="104" x2="120" y2="116" class="line"/>
  <!-- Varistor Box 3 -->
  <rect x="111" y="116" width="18" height="26" class="box"/>
  <line x1="108" y1="138" x2="132" y2="120" class="line"/>
  <line x1="132" y1="120" x2="132" y2="126" class="line"/>
  <line x1="120" y1="142" x2="120" y2="155" class="line"/>
  <rect x="116" y="155" width="8" height="10" class="black-rect"/>
  <line x1="120" y1="165" x2="120" y2="195" class="line"/>

  <!-- Module 4 Column (N) -->
  <rect x="142" y="48" width="36" height="135" class="dashdot"/>
  <rect x="156" y="55" width="8" height="10" class="black-rect"/>
  <line x1="160" y1="65" x2="160" y2="78" class="line"/>
  <!-- Switch / Thermal Disconnect Box 4 -->
  <rect x="147" y="78" width="26" height="26" class="box"/>
  <path d="M 153 98 L 153 88 L 158 88 L 158 94 L 163 94 L 167 84" class="line"/>
  <line x1="160" y1="104" x2="160" y2="116" class="line"/>
  <!-- Varistor Box 4 -->
  <rect x="151" y="116" width="18" height="26" class="box"/>
  <line x1="148" y1="138" x2="172" y2="120" class="line"/>
  <line x1="172" y1="120" x2="172" y2="126" class="line"/>
  <line x1="160" y1="142" x2="160" y2="155" class="line"/>
  <rect x="156" y="155" width="8" height="10" class="black-rect"/>
  <line x1="160" y1="165" x2="160" y2="195" class="line"/>

  <!-- Bottom Common Connection Bus Line -->
  <line x1="40" y1="195" x2="160" y2="195" class="line"/>
  <circle cx="80" cy="195" r="3" fill="#0f172a"/>
  <circle cx="120" cy="195" r="3" fill="#0f172a"/>
  <circle cx="160" cy="195" r="3" fill="#0f172a"/>

  <!-- Bottom Terminal Nodes (Earth Ground & PE) -->
  <!-- Left Ground Node -->
  <line x1="120" y1="195" x2="120" y2="213" class="line"/>
  <circle cx="120" cy="213" r="4" class="node"/>
  <!-- Ground Symbol below node -->
  <line x1="120" y1="217" x2="120" y2="223" class="line"/>
  <line x1="112" y1="223" x2="128" y2="223" class="line"/>
  <line x1="115" y1="227" x2="125" y2="227" class="line"/>
  <line x1="118" y1="231" x2="122" y2="231" class="line"/>

  <!-- Right PE Node -->
  <line x1="160" y1="195" x2="160" y2="213" class="line"/>
  <circle cx="160" cy="213" r="4" class="node"/>
  <text x="160" y="231" class="txt">PE</text>
</svg>
