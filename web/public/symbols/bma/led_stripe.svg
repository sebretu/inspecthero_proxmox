<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Glowing/Warm Yellow LED Stripe Rectangle -->
  <rect x="12" y="32" width="76" height="36" rx="4" fill="#fef08a" fill-opacity="0.4" stroke="#eab308" stroke-width="6" />
  <!-- Center LED strip dashed track -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#ca8a04" stroke-width="3" stroke-dasharray="6, 8" stroke-linecap="round" />
  <!-- Yellow LED light diodes -->
  <circle cx="28" cy="50" r="3.5" fill="#eab308" />
  <circle cx="42" cy="50" r="3.5" fill="#eab308" />
  <circle cx="58" cy="50" r="3.5" fill="#eab308" />
  <circle cx="72" cy="50" r="3.5" fill="#eab308" />
</svg>
