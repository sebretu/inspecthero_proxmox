name: tiles-lock

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "tools/**"
      - ".github/workflows/tiles-lock.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "tools/**"
      - ".github/workflows/tiles-lock.yml"
  workflow_dispatch: {}

jobs:
  tiles-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tiles-lock check
        run: |
          bash tools/tiles-lock.sh check
