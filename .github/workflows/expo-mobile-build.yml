name: Build Expo Mobile (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      build_type:
        description: 'Build Type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🎨 Ensure Valid Assets Exist
        run: node apps/mobile/generate_pngs.js

      - name: ⚙️ Prebuild Android Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Android APK (Debug / Preview)
        working-directory: ./apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-14
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🎨 Ensure Valid Assets Exist
        run: node apps/mobile/generate_pngs.js

      - name: ⚙️ Prebuild iOS Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Simulator Build
        working-directory: ./apps/mobile/ios
        run: |
          pod install
          xcodebuild -workspace et4u.xcworkspace \
                     -scheme et4u \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO

      - name: 📤 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-ios-simulator-app
          path: apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/et4u.app
          retention-days: 14
