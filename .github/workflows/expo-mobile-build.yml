name: Build Expo Mobile (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      build_type:
        description: 'Build Type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

env:
  EXPO_PUBLIC_SUPABASE_URL: https://api.inspecthero.pl
  EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc5NzI4OTQzLCJleHAiOjIwOTUwODg5NDN9.GeDuftnqf8z1mcK2zc1uCismil4t49iNBZsViXWJnkY
  EXPO_PUBLIC_API_URL: https://inspecthero.pl

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🎨 Ensure Valid Assets Exist
        run: node apps/mobile/generate_pngs.js

      - name: ⚙️ Prebuild Android Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Debug Signing for Standalone Release APK
        working-directory: ./apps/mobile/android/app
        run: |
          # Configure release build to use debug signing key so APK is fully standalone without local Metro
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle

      - name: 🔨 Compile Standalone Android APK (Release with Embedded JS Bundle)
        working-directory: ./apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Standalone Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-android-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios' || github.event_name != 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🎨 Ensure Valid Assets Exist
        run: node apps/mobile/generate_pngs.js

      - name: ⚙️ Prebuild iOS Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Physical Device Build (arm64 Release with Embedded JS Bundle)
        working-directory: ./apps/mobile/ios
        run: |
          pod install
          xcodebuild -workspace et4u.xcworkspace \
                     -scheme et4u \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 📦 Package iOS Physical Device IPA with Ad-Hoc Signatures
        working-directory: ./apps/mobile/ios/build/Build/Products/Release-iphoneos
        run: |
          # Ad-hoc sign embedded frameworks and the main executable so sideloading tools can replace signature properly
          if [ -d "et4u.app/Frameworks" ]; then
            find et4u.app/Frameworks -type f \( -name "*.dylib" -o -name "*.framework" \) -exec codesign --force --sign - {} + || true
          fi
          codesign --force --deep --sign - et4u.app || true
          mkdir -p Payload
          cp -r et4u.app Payload/
          zip -r -q et4u-ios-device-unsigned.ipa Payload

      - name: 📤 Upload iOS Device IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-ios-device-ipa
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/et4u-ios-device-unsigned.ipa
          retention-days: 14
