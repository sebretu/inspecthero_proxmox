name: Build Expo Mobile (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      build_type:
        description: 'Build Type'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ⚙️ Prebuild Android Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Android APK (Debug / Preview)
        working-directory: ./apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-android-preview.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-14
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install Root / Shared Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ⚙️ Prebuild iOS Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile iOS Simulator Build (Archive)
        working-directory: ./apps/mobile/ios
        run: |
          pod install
          xcodebuild -workspace et4u.xcworkspace -scheme et4u -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet

      - name: 📤 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: et4u-ios-simulator.app
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/et4u.app
          retention-days: 14
