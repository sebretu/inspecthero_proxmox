name: Build iOS (Expo Standalone & Simulator)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'

env:
  EXPO_PUBLIC_SUPABASE_URL: https://api.inspecthero.pl
  EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc5NzI4OTQzLCJleHAiOjIwOTUwODg5NDN9.GeDuftnqf8z1mcK2zc1uCismil4t49iNBZsViXWJnkY
  EXPO_PUBLIC_API_URL: https://inspecthero.pl

jobs:
  build_ios_simulator:
    name: 🍎 Build iOS Simulator App & Expo Bundle
    runs-on: macos-latest
    steps:
      - name: 🏗️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package.json

      - name: 📦 Install Dependencies
        run: |
          npm --prefix packages/sync-protocol install
          npm --prefix apps/mobile install --legacy-peer-deps

      - name: 🎨 Ensure Valid Assets Exist
        run: node apps/mobile/generate_pngs.js

      - name: ⚙️ Prebuild iOS Native Project
        working-directory: ./apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 Setup CocoaPods & Install Pods
        working-directory: ./apps/mobile/ios
        run: pod install

      - name: 🔨 Compile iOS Simulator .app Bundle
        working-directory: ./apps/mobile/ios
        run: |
          xcodebuild \
            -workspace et4u.xcworkspace \
            -scheme et4u \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package iOS Simulator Build
        working-directory: ./apps/mobile/ios/build/Build/Products/Release-iphonesimulator
        run: |
          tar -czvf et4u-ios-simulator.tar.gz et4u.app

      - name: 📤 Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-ios-simulator
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/et4u-ios-simulator.tar.gz
          retention-days: 14

  eas_build_ios:
    name: ☁️ EAS Cloud Build (TestFlight / IPA)
    runs-on: ubuntu-latest
    if: env.EXPO_TOKEN != ''
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: 🏗️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🚀 Run EAS Build for iOS
        working-directory: ./apps/mobile
        run: |
          eas build --platform ios --profile preview --non-interactive
