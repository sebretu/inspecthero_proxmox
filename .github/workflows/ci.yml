name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci --legacy-peer-deps

      - name: Run Lint
        working-directory: ./web
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        working-directory: ./web
        run: npm test

      - name: Build Project
        working-directory: ./web
        run: npm run build
